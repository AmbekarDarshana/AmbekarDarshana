<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDEBF5"/>
      <stop offset="55%" stop-color="#F9DCCB"/>
      <stop offset="100%" stop-color="#FCEBD9"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="300" rx="24" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="990" cy="85" r="46" fill="#F7D98B" opacity="0.9"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="170" cy="70" rx="70" ry="22"/>
    <ellipse cx="212" cy="58" rx="45" ry="24"/>
    <ellipse cx="540" cy="52" rx="60" ry="18"/>
    <ellipse cx="578" cy="44" rx="40" ry="20"/>
    <ellipse cx="820" cy="150" rx="55" ry="16"/>
  </g>

  <!-- Floating code symbols -->
  <text x="650" y="120" font-family="monospace" font-size="34" font-weight="bold" fill="#B8A4DC">{ }</text>
  <text x="720" y="82" font-family="monospace" font-size="28" font-weight="bold" fill="#D4A853">&lt;/&gt;</text>
  <text x="610" y="176" font-family="monospace" font-size="26" font-weight="bold" fill="#F4B9A0">$ _</text>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M430 60 Q430 80 450 80 Q430 80 430 100 Q430 80 410 80 Q430 80 430 60 Z"/>
    <path d="M760 40 Q760 52 772 52 Q760 52 760 64 Q760 52 748 52 Q760 52 760 40 Z"/>
    <path d="M1110 190 Q1110 202 1122 202 Q1110 202 1110 214 Q1110 202 1098 202 Q1110 202 1110 190 Z"/>
  </g>
  <g fill="#F4B9A0">
    <circle cx="470" cy="130" r="4"/>
    <circle cx="1040" cy="40" r="3"/>
    <circle cx="600" cy="240" r="3"/>
  </g>

  <!-- Hills -->
  <path d="M0 220 Q200 160 420 210 T860 200 T1200 190 L1200 300 L0 300 Z" fill="#B9E3CF"/>
  <path d="M0 255 Q260 205 560 250 T1200 240 L1200 300 L0 300 Z" fill="#8FD0B5"/>

  <!-- Cute round trees -->
  <circle cx="460" cy="232" r="14" fill="#7BC4A4"/>
  <rect x="457" y="240" width="6" height="14" fill="#8A6A5A"/>
  <circle cx="1140" cy="236" r="18" fill="#7BC4A4"/>
  <rect x="1137" y="248" width="6" height="16" fill="#8A6A5A"/>

  <!-- Laptop -->
  <rect x="905" y="165" width="150" height="100" rx="12" fill="#2B2326"/>
  <rect x="916" y="176" width="128" height="78" rx="6" fill="#FFF4EC"/>
  <rect x="930" y="192" width="60" height="5" rx="2" fill="#F4B9A0"/>
  <rect x="930" y="204" width="90" height="5" rx="2" fill="#D4A853"/>
  <rect x="930" y="216" width="48" height="5" rx="2" fill="#A8D8C8"/>
  <path d="M980 226 L968 214 C958 204 966 192 975 196 C978 197 980 200 980 200 C980 200 982 197 985 196 C994 192 1002 204 992 214 Z" fill="#F4A6A0"/>
  <path d="M875 265 H1085 L1095 280 H865 Z" fill="#2B2326"/>

  <!-- Text -->
  <text x="80" y="150" font-family="Segoe UI, Quicksand, Arial, sans-serif" font-size="60" font-weight="bold" fill="#2B2326">Darshana Ambekar</text>
  <text x="80" y="190" font-family="Segoe UI, Quicksand, Arial, sans-serif" font-size="24" fill="#8A5A4A">MCA Student · Learning DevOps by building</text>

  <!-- Skill chips -->
  <rect x="80" y="212" width="96" height="30" rx="15" fill="#FFFFFF" stroke="#F4B9A0" stroke-width="2"/>
  <text x="128" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B2326" text-anchor="middle">Docker</text>
  <rect x="190" y="212" width="100" height="30" rx="15" fill="#FFFFFF" stroke="#D4A853" stroke-width="2"/>
  <text x="240" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B2326" text-anchor="middle">CI/CD</text>
  <rect x="304" y="212" width="96" height="30" rx="15" fill="#FFFFFF" stroke="#A8D8C8" stroke-width="2"/>
  <text x="352" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B2326" text-anchor="middle">Linux</text>
</svg>
